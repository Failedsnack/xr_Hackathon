name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Unit and end-to-end tests
        run: python -m pytest -q

      - name: Validate committed outputs
        # Fails on any invalid file; the batch may still be running, so missing files are allowed here.
        run: python tools/validate.py --dir outputs --allow-missing --quiet

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run it on a synthetic clip
        run: |
          docker build -t xr-vsum .
          mkdir -p /tmp/in /tmp/out
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -v error -f lavfi -i testsrc2=duration=40:size=320x240:rate=25 -pix_fmt yuv420p /tmp/in/clip.mp4
          docker run --rm -v /tmp/in:/in:ro -v /tmp/out:/out xr-vsum /in/clip.mp4 /out/clip.json
          python3 -c "import json; r=json.load(open('/tmp/out/clip.json')); print(r['label'], len(r['highlights']), 'highlights')"
